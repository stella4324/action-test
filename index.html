<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시각-운동 반응속도 측정 검사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Pretendard", sans-serif; }
    body { background-color: #121214; color: #e1e1e6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .container { width: 920px; max-width: 95vw; background: #202024; border-radius: 12px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #323238; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 24px; margin-bottom: 12px; color: #00b37e; }
    p { color: #c4c4cc; line-height: 1.6; font-size: 15px; text-align: center; }
    .key-badge { display: inline-block; background: #29292e; border: 1px solid #51515c; border-radius: 6px; padding: 3px 10px; font-weight: bold; color: #04d361; margin: 0 4px; font-size: 16px; }
    .btn { margin-top: 20px; background: #00875f; color: #fff; border: none; padding: 13px 36px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #00b37e; }
    .input-box { background: #121214; border: 1px solid #51515c; color: #fff; padding: 10px 15px; border-radius: 6px; font-size: 15px; margin-top: 15px; width: 250px; text-align: center; }
    #task-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
    .progress-bar-container { width: 100%; height: 8px; background: #29292e; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .progress-bar { height: 100%; width: 0%; background: #00b37e; transition: width 0.15s ease; }
    .stage-indicator { font-size: 14px; color: #8d8d99; margin-bottom: 15px; }
    .canvas-arena { position: relative; width: 520px; height: 520px; background: #121214; border: 2px solid #323238; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .fixation { font-size: 38px; font-weight: bold; color: #7c7c8a; user-select: none; }
    .stimulus { position: absolute; font-size: 52px; font-weight: 900; color: #ffffff; user-select: none; line-height: 1; }
    .pos-top { top: 50px; left: 50%; transform: translateX(-50%); }
    .pos-bottom { bottom: 50px; left: 50%; transform: translateX(-50%); }
    .pos-left { left: 50px; top: 50%; transform: translateY(-50%); }
    .pos-right { right: 50px; top: 50%; transform: translateY(-50%); }
    .feedback-text { position: absolute; bottom: 25px; font-size: 15px; font-weight: bold; }
    .fb-correct { color: #04d361; }
    .fb-wrong { color: #f75a68; }
    #result-screen { display: none; width: 100%; flex-direction: column; align-items: center; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- 안내 및 ID 입력 -->
  <div id="instruction-screen">
    <h1>시각-운동 반응속도 측정 검사</h1>
    <p style="margin-top: 10px;">
      본 검사는 시각 기호를 인식하고 키보드로 출력하는 <strong>순간 반응 속도(ms)</strong>를 측정합니다.<br>
      화면 어디에 나타나든 상관없이, 나타난 <strong>화살표의 방향</strong>을 보고 <strong>최대한 빠르고 정확하게</strong> 방향키를 누르세요!
    </p>

    <div style="margin: 15px 0; background: #121214; padding: 15px; border-radius: 8px; border: 1px solid #323238;">
      <p style="font-weight: bold; margin-bottom: 8px; color: #fff;">키보드 조작 규칙</p>
      <p>
        &uarr; &rarr; <span class="key-badge">&uarr;</span> | 
        &darr; &rarr; <span class="key-badge">&darr;</span> | 
        &larr; &rarr; <span class="key-badge">&larr;</span> | 
        &rarr; &rarr; <span class="key-badge">&rarr;</span>
      </p>
    </div>

    <div>
      <input type="text" id="participant-id" class="input-box" placeholder="이름 또는 참가자 번호 입력" />
    </div>

    <button class="btn" onclick="checkAndStart()">테스트 시작하기 (연습 5회)</button>
  </div>

  <!-- 실험 화면 -->
  <div id="task-screen">
    <div class="progress-bar-container"><div id="progress" class="progress-bar"></div></div>
    <div id="stage-text" class="stage-indicator">준비 중...</div>
    <div class="canvas-arena">
      <div id="fixation" class="fixation">+</div>
      <div id="stimulus" class="stimulus" style="display: none;"></div>
      <div id="feedback" class="feedback-text" style="display: none;"></div>
    </div>
  </div>

  <!-- 종료 화면 -->
  <div id="result-screen">
    <h1>검사가 모두 완료되었습니다!</h1>
    <p id="upload-status" style="margin-top: 20px; font-size: 17px; color: #00b37e;">데이터를 서버로 전송 중입니다...</p>
    <p style="margin-top: 10px; color: #8d8d99; font-size: 14px;">창을 닫으셔도 좋습니다. 수고하셨습니다!</p>
  </div>
</div>

<script>
  // [중요] 여기에 Step A에서 복사한 구글 앱스 스크립트 웹 앱 URL을 붙여넣으세요!
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7VR5gcaugdNCMFYR3P7qy1lhhPfI31C8EL84VnGoovxAR-Gp3dAE0czWOkjpLK8KUZA/exec";

  const ARROWS = ["↑", "↓", "←", "→"];
  const LOCATIONS = ["top", "bottom", "left", "right"];
  const KEY_MAPPING = { "ArrowUp": "↑", "ArrowDown": "↓", "ArrowLeft": "←", "ArrowRight": "→" };
  const LOC_TO_ARROW = { "top": "↑", "bottom": "↓", "left": "←", "right": "→" };
  const LOC_KOREAN = { "top": "위", "bottom": "아래", "left": "왼쪽", "right": "오른쪽" };

  let participantId = "";
  let experimentData = [];
  let trialQueue = [];
  let currentTrial = null;
  let isPractice = true;
  let trialIndex = 0;
  let totalTrials = 0;
  let stimulusStartTime = 0;
  let acceptingInput = false;

  function classifyTrial(arrow, loc) {
    const isArrowVertical = (arrow === "↑" || arrow === "↓");
    const isLocVertical = (loc === "top" || loc === "bottom");
    let dimension = (isArrowVertical && isLocVertical) ? "Vertical" : (!isArrowVertical && !isLocVertical) ? "Horizontal" : "Cross-Orthogonal";
    let congruency = (LOC_TO_ARROW[loc] === arrow) ? "Congruent" : (dimension !== "Cross-Orthogonal") ? "Incongruent-Opposite" : "Incongruent-Orthogonal";
    return { congruency, dimension };
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function checkAndStart() {
    participantId = document.getElementById("participant-id").value.trim();
    if (!participantId) {
      alert("참가자 이름이나 번호를 입력해 주세요.");
      return;
    }
    startPractice();
  }

  function startPractice() {
    isPractice = true;
    trialIndex = 0;
    let pool = [];
    ARROWS.forEach(a => LOCATIONS.forEach(l => pool.push({ arrow: a, location: l })));
    trialQueue = shuffle(pool).slice(0, 5);
    totalTrials = trialQueue.length;

    document.getElementById("instruction-screen").style.display = "none";
    document.getElementById("task-screen").style.display = "flex";
    runNextTrial();
  }

  function startMainExperiment() {
    isPractice = false;
    trialIndex = 0;
    let pool = [];
    for (let r = 0; r < 4; r++) {
      ARROWS.forEach(a => LOCATIONS.forEach(l => pool.push({ arrow: a, location: l })));
    }
    trialQueue = shuffle(pool);
    totalTrials = trialQueue.length;
    runNextTrial();
  }

  function runNextTrial() {
    if (trialIndex >= totalTrials) {
      if (isPractice) {
        alert("연습(5회)이 완료되었습니다.\n본 테스트(64회)를 시작합니다.");
        startMainExperiment();
      } else {
        finishAndUpload();
      }
      return;
    }

    currentTrial = trialQueue[trialIndex];
    trialIndex++;

    document.getElementById("progress").style.width = ((trialIndex - 1) / totalTrials * 100) + "%";
    document.getElementById("stage-text").innerText = isPractice ? `[연습] ${trialIndex} / ${totalTrials}` : `[본 검사] ${trialIndex} / ${totalTrials}`;

    const fix = document.getElementById("fixation");
    const stim = document.getElementById("stimulus");
    const fb = document.getElementById("feedback");

    fb.style.display = "none";
    stim.style.display = "none";
    stim.className = "stimulus";
    fix.style.display = "block";

    setTimeout(() => {
      fix.style.display = "none";
      stim.innerText = currentTrial.arrow;
      stim.classList.add("pos-" + currentTrial.location);
      stim.style.display = "block";

      stimulusStartTime = performance.now();
      acceptingInput = true;
    }, 500);
  }

  window.addEventListener("keydown", function(e) {
    if (!acceptingInput || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
    e.preventDefault();
    acceptingInput = false;

    const rt = Math.round(performance.now() - stimulusStartTime);
    const isCorrect = (KEY_MAPPING[e.key] === currentTrial.arrow) ? 1 : 0;
    const { congruency, dimension } = classifyTrial(currentTrial.arrow, currentTrial.location);

    if (!isPractice) {
      experimentData.push({
        trial_num: trialIndex,
        stage: "Main",
        stim_arrow: currentTrial.arrow,
        stim_location: LOC_KOREAN[currentTrial.location],
        congruency: congruency,
        dimension: dimension,
        response_key: e.key.replace("Arrow", ""),
        is_correct: isCorrect,
        rt_ms: rt
      });
    }

    if (isPractice) {
      const fb = document.getElementById("feedback");
      fb.innerText = isCorrect ? `정답! (${rt}ms)` : `오답! (정답: ${currentTrial.arrow})`;
      fb.className = "feedback-text " + (isCorrect ? "fb-correct" : "fb-wrong");
      fb.style.display = "block";
      setTimeout(runNextTrial, 500);
    } else {
      document.getElementById("stimulus").style.display = "none";
      setTimeout(runNextTrial, 400);
    }
  });

  // 구글 시트로 데이터 일괄 전송
  function finishAndUpload() {
    document.getElementById("task-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "flex";

    const payload = {
      participantId: participantId,
      trials: experimentData
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(() => {
      document.getElementById("upload-status").innerText = "✓ 모든 데이터가 성공적으로 저장되었습니다!";
    }).catch(err => {
      document.getElementById("upload-status").innerText = "전송 완료 (창을 닫으셔도 됩니다)";
    });
  }
</script>

</body>
</html>
